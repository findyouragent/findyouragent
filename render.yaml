services:
  - type: web
    name: findyouragent-verify
    runtime: node
    rootDir: server
    plan: starter
    # Local persistence and background sweeps require one writer.
    numInstances: 1
    # Deploy after CI passes.
    autoDeployTrigger: "off"
    buildCommand: npm ci
    startCommand: npm start
    # Process liveness only.
    healthCheckPath: /health

    # Retain checks beyond the startup seed on a persistent disk.
    disk:
      name: verdicts
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      - key: DATA_DIR
        value: /var/data

      # Set credentials in the Render dashboard. Upstream quota headers are authoritative.
      - key: SCAN8004_API_KEY
        sync: false

      # Dedicated BSC RPC read capacity; unavailable reads leave activity unknown.
      - key: BSC_RPC_URL
        sync: false

      # Comma-separated exact browser origins; add other deployed frontend URLs as needed.
      - key: ALLOWED_ORIGIN
        value: https://findyouragent.xyz

      # Enable after provider readiness and persistent storage have been checked.
      - key: SWEEP_ENABLED
        value: "false"
      - key: SWEEP_INTERVAL_MS
        value: "30000"
      - key: SWEEP_PAGE_CYCLE
        value: "40"
      - key: SWEEP_PAGE_SIZE
        value: "25"
      - key: SWEEP_BASELINE_SAMPLE
        value: "25"
